name: PR Test & Auto-Merge

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true

      - name: 🚀 Setup Very Good CLI
        run: dart pub global activate very_good_cli

      - name: 📦 Install deps
        run: |
          cd apps/flutter_realm_test/
          flutter pub get

      - name: 🧪 Run Tests
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          very_good test

