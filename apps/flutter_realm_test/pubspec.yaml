name: test_flutter_project
description: "Test Flutter Project for realm, go-router, rxDart and mockito"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

# adding resolution: workspace makes melos work, but breaks build runner if launched from the makefile

dependencies:
  bloc_test: ^10.0.0
  cached_network_image: ^3.4.1
  collection: ^1.19.1
  core_ui:
    path: ../../packages/core_ui/
  cupertino_icons: ^1.0.8
  dartz: 0.10.1
  file_picker: ^10.3.10
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_colorpicker: ^1.1.0
  flutter_dotenv: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_slidable: ^4.0.3
  flutter_svg: ^2.2.4
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.2
  get_it: ^9.2.0
  go_router: ^17.0.1
  http: ^1.6.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  logger: ^2.7.0
  mockito: ^5.4.6
  path_provider: ^2.0.15
  permission_handler: ^12.0.1
  realm: ^20.2.0
  rxdart: ^0.28.0
  share_plus: ^12.0.1
  shared_preferences: ^2.5.4
  skeletonizer: ^2.1.3
  smooth_page_indicator: ^2.0.1
  transparent_image: ^2.0.1
  url_launcher: ^6.3.2
  visibility_detector: ^0.4.0+2
  widgetbook: ^3.14.0

dev_dependencies:
  build_runner: ^2.4.9
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  melos: ^7.0.0

dependency_overrides:
  analyzer: 7.3.0
  analyzer_plugin: 0.12.0
  build_daemon: 4.0.1
  build_runner: 2.4.9
  dart_style: 2.3.7
  test_api: 0.7.10
  test_core: 0.6.17

flutter:
  uses-material-design: true

  assets:
    - assets/mocks/
    - assets/images/
    - assets/images/country_flags/
    - assets/images/manufacturer_icons/
    - assets/env/

  fonts:
    - family: Zona Pro
      fonts:
        - asset: assets/fonts/ZonaPro-ExtraLight.otf
          weight: 200
        - asset: assets/fonts/ZonaPro-Light.otf
          weight: 300
        - asset: assets/fonts/ZonaPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/ZonaPro-SemiBold.otf
          weight: 600
        - asset: assets/fonts/ZonaPro-Bold.otf
          weight: 700
